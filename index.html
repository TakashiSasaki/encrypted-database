<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Database Library</title>
    <link rel="canonical" href="https://vault.moukaeritai.work/">
    <link rel="manifest" href="demo/manifest.json">
    <link rel="icon" href="demo/icon.svg" type="image/svg+xml">
    <!-- GitHub Markdown CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        @media (max-width: 767px) {
            body {
                padding: 15px;
            }
        }
    </style>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify for sanitization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</head>
<body class="markdown-body">
    <nav aria-label="Main Navigation" style="margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eaecef;">
        <a href="#" id="show-index-btn" role="button" aria-controls="index-container content" aria-expanded="false" style="font-weight: bold; margin-right: 15px; color: #0969da; text-decoration: none;">Navigation:</a>
        <a href="?file=README.md" style="margin-right: 15px;">Home (README)</a>
        <a href="?file=docs/database-structure.md" style="margin-right: 15px;">Database Structure</a>
        <a href="demo/index.html" style="margin-right: 15px;">Browser Demo</a>
        <a href="?file=docs/README.md">Key Management Spec</a>
    </nav>
    <div id="file-path-display" style="margin-bottom: 15px; font-size: 0.9em; color: #57606a;"></div>
    <main>
        <div id="content" aria-live="polite" style="background-color: #ffffe0; padding: 20px; border-radius: 6px;">Loading...</div>
        <div id="index-container" aria-live="polite" style="display: none; background-color: #f6f8fa; padding: 20px; border-radius: 6px;">
            <h2>All Documents</h2>
            <ul id="index-list"></ul>
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contentDiv = document.getElementById('content');
            const pathDisplayDiv = document.getElementById('file-path-display');
            const indexContainer = document.getElementById('index-container');
            const indexList = document.getElementById('index-list');
            const showIndexBtn = document.getElementById('show-index-btn');

            function getQueryParam(name) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(name);
            }

            function resolvePath(base, relative) {
                if (relative.startsWith('/')) return relative.substring(1);
                // Ignore external URLs and specific schemes (http, mailto, etc.)
                if (/^[a-zA-Z]+:/.test(relative) || relative.startsWith('//')) return relative;

                const baseParts = base.split('/');
                baseParts.pop(); // Remove the filename
                const relativeParts = relative.split('/');

                for (let part of relativeParts) {
                    if (part === '.') {
                        continue;
                    } else if (part === '..') {
                        if (baseParts.length > 0) baseParts.pop();
                    } else {
                        baseParts.push(part);
                    }
                }
                return baseParts.join('/');
            }

            async function fetchDocumentIndex() {
                const CACHE_KEY = 'vault_docs_index';
                const cached = sessionStorage.getItem(CACHE_KEY);
                if (cached) {
                    return JSON.parse(cached);
                }

                try {
                    const response = await fetch('https://api.github.com/repos/TakashiSasaki/vault.moukaeritai.work/git/trees/vault.moukaeritai.work?recursive=1');
                    if (!response.ok) throw new Error('Failed to fetch repository tree');
                    const data = await response.json();

                    const mdFiles = data.tree
                        .filter(item => item.type === 'blob' && item.path.endsWith('.md'))
                        .map(item => item.path);

                    sessionStorage.setItem(CACHE_KEY, JSON.stringify(mdFiles));
                    return mdFiles;
                } catch (error) {
                    console.error('Error fetching document index:', error);
                    return [];
                }
            }

            async function loadMarkdown() {
                // Ensure index is hidden and content is visible
                showIndexBtn.setAttribute('aria-expanded', 'false');
                indexContainer.style.display = 'none';
                contentDiv.style.display = 'block';

                let file = getQueryParam('file') || 'README.md';

                // Update document title for accessibility and UX
                const filename = file.split('/').pop();
                document.title = `${filename} - Encrypted Database Library`;

                // Security check to prevent fetching external resources
                if (/^[a-zA-Z]+:/.test(file) || file.startsWith('//')) {
                    contentDiv.innerHTML = `<p>Error: Loading external files is not allowed.</p>`;
                    pathDisplayDiv.innerHTML = '';
                    return;
                }

                // Update file path display with GitHub link
                pathDisplayDiv.innerHTML = 'Source: ';
                const githubLink = document.createElement('a');
                githubLink.href = `https://github.com/TakashiSasaki/vault.moukaeritai.work/blob/vault.moukaeritai.work/${file}`;
                githubLink.target = '_blank';
                githubLink.rel = 'noopener noreferrer';
                githubLink.textContent = file;
                pathDisplayDiv.appendChild(githubLink);

                try {
                    const response = await fetch(file);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const text = await response.text();

                    // Configure marked to handle mermaid code blocks
                    const renderer = new marked.Renderer();
                    const originalCodeRenderer = renderer.code.bind(renderer);

                    // Helper function to escape HTML special characters
                    const escapeHtml = (unsafe) => {
                        return unsafe
                             .replace(/&/g, "&amp;")
                             .replace(/</g, "&lt;")
                             .replace(/>/g, "&gt;")
                             .replace(/"/g, "&quot;")
                             .replace(/'/g, "&#039;");
                    };

                    renderer.code = function({ text, lang, escaped }) {
                        if (lang === 'mermaid') {
                            return `<div class="mermaid">${escapeHtml(text)}</div>`;
                        }
                        return originalCodeRenderer({ text, lang, escaped });
                    };

                    marked.use({ renderer });

                    // Parse markdown to HTML, then sanitize it to prevent DOM XSS
                    const rawHtml = marked.parse(text);
                    // Allow class="mermaid" in DOMPurify
                    const cleanHtml = DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['class'] });
                    contentDiv.innerHTML = cleanHtml;

                    // Initialize and render Mermaid diagrams if any exist
                    if (contentDiv.querySelector('.mermaid')) {
                        // Dynamically inject Mermaid script only when needed
                        if (!window.mermaid) {
                            await new Promise((resolve, reject) => {
                                const script = document.createElement('script');
                                script.src = 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js';
                                script.onload = resolve;
                                script.onerror = reject;
                                document.head.appendChild(script);
                            });
                        }
                        mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
                        await mermaid.run({
                            querySelector: '#content .mermaid'
                        }).catch(e => console.error('Mermaid rendering failed', e));
                    }

                    // Fix relative image paths
                    const images = contentDiv.querySelectorAll('img');
                    images.forEach(img => {
                        const src = img.getAttribute('src');
                        if (src && !/^[a-zA-Z]+:/.test(src) && !src.startsWith('//')) {
                            img.setAttribute('src', resolvePath(file, src));
                        }
                    });

                    // Intercept links
                    const links = contentDiv.querySelectorAll('a');
                    links.forEach(link => {
                        const href = link.getAttribute('href');
                        if (href && !/^[a-zA-Z]+:/.test(href) && !href.startsWith('//') && !href.startsWith('#')) {
                            // Handle path and hash
                            let path = href;
                            let hash = '';
                            const hashIndex = href.indexOf('#');
                            if (hashIndex !== -1) {
                                path = href.substring(0, hashIndex);
                                hash = href.substring(hashIndex);
                            }

                            // If path is empty, it's just a hash link, which we skip processing
                            if (path) {
                                const resolvedPath = resolvePath(file, path);
                                if (resolvedPath.endsWith('.md')) {
                                    // Change href so users can hover and see a sensible link or open in new tab
                                    const newUrl = new URL(window.location);
                                    newUrl.searchParams.set('file', resolvedPath);
                                    newUrl.hash = hash;
                                    link.setAttribute('href', newUrl.toString());

                                    link.addEventListener('click', (e) => {
                                        // Allow cmd+click / ctrl+click to open in new tab normally
                                        if (e.ctrlKey || e.metaKey) return;

                                        e.preventDefault();
                                        window.history.pushState({}, '', newUrl.toString());
                                        loadMarkdown();
                                    });
                                } else {
                                    link.setAttribute('href', resolvedPath + hash);
                                }
                            }
                        }
                    });

                    // Scroll to hash if present
                    if (window.location.hash) {
                        setTimeout(() => {
                            const id = window.location.hash.substring(1);
                            // marked might create ids depending on config.
                            const target = document.getElementById(id) || document.querySelector(`[name="${id}"]`);
                            if (target) {
                                target.scrollIntoView();
                            }
                        }, 100);
                    }

                } catch (error) {
                    contentDiv.innerHTML = `<p>Error loading markdown file: <code>${file}</code></p><p>${error.message}</p>`;
                }
            }

            // Handle clicking the "Navigation" link
            showIndexBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                showIndexBtn.setAttribute('aria-expanded', 'true');

                // Hide content, show index
                contentDiv.style.display = 'none';
                pathDisplayDiv.innerHTML = 'Index';
                indexContainer.style.display = 'block';
                indexList.innerHTML = '<li>Loading document list...</li>';
                document.title = 'Index - Encrypted Database Library';

                // Update URL to empty file parameter so reloading doesn't show a specific file if they are on index
                const newUrl = new URL(window.location);
                newUrl.searchParams.delete('file');
                window.history.pushState({ isIndex: true }, '', newUrl.toString());

                const files = await fetchDocumentIndex();

                if (files.length === 0) {
                    indexList.innerHTML = '<li>Could not load document list.</li>';
                    return;
                }

                indexList.innerHTML = '';
                files.forEach(file => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `?file=${file}`;
                    a.textContent = file;

                    a.addEventListener('click', (e) => {
                        if (e.ctrlKey || e.metaKey) return;
                        e.preventDefault();
                        const fileUrl = new URL(window.location);
                        fileUrl.searchParams.set('file', file);
                        window.history.pushState({}, '', fileUrl.toString());
                        loadMarkdown();
                    });

                    li.appendChild(a);
                    indexList.appendChild(li);
                });
            });

            // Handle browser back/forward buttons
            window.addEventListener('popstate', (e) => {
                const urlParams = new URLSearchParams(window.location.search);
                if (!urlParams.has('file') && e.state && e.state.isIndex) {
                    // We're back to the index view
                    showIndexBtn.click();
                } else {
                    loadMarkdown();
                }
            });

            // Initial load
            const initialUrlParams = new URLSearchParams(window.location.search);
            // If the user navigates directly to the root with no file, we default to README.md in loadMarkdown,
            // so we don't automatically show the index unless they click the button.
            loadMarkdown();
        });
    </script>
</body>
</html>
