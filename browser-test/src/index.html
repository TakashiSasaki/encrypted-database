<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Storage Browser Test</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #output { margin-top: 20px; padding: 10px; background: #f0f0f0; border: 1px solid #ccc; font-family: monospace; white-space: pre-wrap; min-height: 200px; max-height: 300px; overflow-y: auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }

        #tables-container { margin-top: 30px; }
        .tabs { display: flex; border-bottom: 1px solid #ccc; margin-bottom: 0; position: relative; z-index: 1; }
        .tab-button { background-color: #f1f1f1; border: none; outline: none; cursor: pointer; padding: 10px 20px; transition: 0.3s; font-size: 16px; border-radius: 5px 5px 0 0; margin-right: 5px; border: 1px solid #ccc; border-bottom: none; }
        .tab-button:hover { background-color: #ddd; }
        .tab-button.active { background-color: #fff; border-bottom: 1px solid #fff; margin-bottom: -1px; font-weight: bold; }
        .tab-content { display: none; border: 1px solid #ccc; border-top: none; padding: 20px; max-height: 600px; overflow-y: auto; background: #fff; }
        .tab-content.active { display: block; }

        .table-wrapper { margin-bottom: 30px; border: 1px solid #ddd; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .table-wrapper h3 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; min-width: 600px; table-layout: fixed; }
        th, td { border: 1px solid #bbb; padding: 8px; text-align: left; word-wrap: break-word; word-break: break-all; font-size: 13px; }
        th { background-color: #eee; }
        .pagination { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .pagination button { padding: 5px 10px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Encrypted Storage Browser Test</h1>
    <p>WebAssembly版のSQLite（sql.js）とargon2-browserを用いて、暗号化データベースの初期化・保存・取得をテストします。</p>
    <style>
        .step-list { margin: 20px 0; padding: 0; list-style-type: none; }
        .step-item { padding: 8px; margin-bottom: 5px; border: 1px solid #ddd; border-radius: 4px; background-color: #fafafa; }
        .step-item.pending { color: #888; }
        .step-item.active { background-color: #e0f7fa; border-color: #26c6da; font-weight: bold; }
        .step-item.completed { background-color: #e8f5e9; border-color: #66bb6a; color: #2e7d32; }
        .step-item.error { background-color: #ffebee; border-color: #ef5350; color: #c62828; }
        .controls { margin-bottom: 20px; }
    </style>

    <div class="controls">
        <button id="nextStepBtn">テスト開始 / 次のステップへ</button>
        <button id="resetTestBtn" style="display: none;">テストをリセット</button>
        <button id="closeDbBtn" disabled>データベースを閉じる</button>
    </div>

    <ul id="stepList" class="step-list">
        <li class="step-item pending" id="step-0">[-] ステップ 1: ストレージインスタンスの作成</li>
        <li class="step-item pending" id="step-1">[-] ステップ 2: データベースの初期化</li>
        <li class="step-item pending" id="step-2">[-] ステップ 3: データの保存</li>
        <li class="step-item pending" id="step-3">[-] ステップ 4: データの取得と検証</li>
        <li class="step-item pending" id="step-4">[-] ステップ 5: データベースのロック</li>
        <li class="step-item pending" id="step-5">[-] ステップ 6: データベースの再解錠</li>
        <li class="step-item pending" id="step-6">[-] ステップ 7: 再解錠後のデータ取得検証</li>
    </ul>

    <div id="output"></div>
    <div id="tables-container">
        <div class="tabs">
            <button class="tab-button active" data-tab-target="dynamic-tables">Dynamic Data</button>
            <button class="tab-button" data-tab-target="setup-tables">Setup Data</button>
        </div>
        <div id="dynamic-tables" class="tab-content active"></div>
        <div id="setup-tables" class="tab-content"></div>
    </div>

    <script src="bundle.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
