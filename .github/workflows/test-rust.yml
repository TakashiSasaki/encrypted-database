name: Rust Tests

on:
  push:
    branches: [ vault.moukaeritai.work ]
  pull_request:
    branches: [ vault.moukaeritai.work ]

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Tests
        run: cd rust && cargo test --verbose
