name: Zig Smoke Test

on:
  push:
    branches: [ vault.moukaeritai.work ]
  pull_request:
    branches: [ vault.moukaeritai.work ]

jobs:
  test-zig:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION="0.16.0"
          ZIG_DIR="zig-x86_64-linux-${ZIG_VERSION}"
          ZIG_TARBALL="${ZIG_DIR}.tar.xz"
          ZIG_URL_OFFICIAL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}"
          ZIG_URL_MIRROR="https://zenithal.link/ziglang/download/${ZIG_VERSION}/${ZIG_TARBALL}"

          # Official SHA256 for 0.16.0 x86_64-linux from https://ziglang.org/download/index.json
          ZIG_SHA256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

          # Attempt official first, fallback to mirror if it fails
          if ! curl -fsSLO "${ZIG_URL_OFFICIAL}"; then
            echo "Official download failed. Falling back to mirror..."
            curl -fsSLO "${ZIG_URL_MIRROR}"
          fi

          echo "${ZIG_SHA256}  ${ZIG_TARBALL}" | shasum -a 256 --check

          tar -xf "${ZIG_TARBALL}"
          echo "${PWD}/${ZIG_DIR}" >> "${GITHUB_PATH}"
          "${PWD}/${ZIG_DIR}/zig" version

      - name: Run Zig Smoke Tests
        shell: bash
        run: |
          set -euo pipefail
          cd zig

          output="$(zig build run)"
          printf '%s\n' "$output"
          test "$output" = "vault zig smoke test ok"

          zig build test

      - name: Run Zig Shared Vectors
        shell: bash
        run: |
          set -euo pipefail
          cd zig
          zig build vectors

      - name: Run Zig Validator CLI Smoke Test
        shell: bash
        run: |
          set -euo pipefail
          if command -v sqlite3 >/dev/null 2>&1; then
            echo "sqlite3 CLI found; running validator CLI smoke test"
            DB_PATH=$(mktemp)
            sqlite3 "$DB_PATH" << 'SQL'
          PRAGMA application_id = 1447906135;
          PRAGMA user_version = 1;
          CREATE TABLE storage_metadata_tbl (property TEXT PRIMARY KEY, value TEXT NOT NULL);
          INSERT INTO storage_metadata_tbl (property, value) VALUES
          ('storage_format_id', 'vault.moukaeritai.work.storage'),
          ('format_major', '1'),
          ('format_minor', '0'),
          ('schema_version', '1'),
          ('required_features', '[]'),
          ('optional_features', '[]'),
          ('sqlite_application_id', '1447906135'),
          ('sqlite_user_version', '1'),
          ('database_uuid', '00000000-0000-4000-8000-000000000001'),
          ('created_at_ms', '1234567890'),
          ('created_by_library', 'test'),
          ('created_by_version', '1.0');
          SQL
            cd zig
            zig build run -- validate "$DB_PATH"
            rm -f "$DB_PATH"
          else
            echo "sqlite3 CLI not found; skipping validator CLI smoke test"
          fi
