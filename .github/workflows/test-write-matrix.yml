name: Write Matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/test-write-matrix.yml"
      - "go/**"
      - "rust/**"
      - "python/**"
      - "nodejs/**"
      - "integration-tests/write-matrix/**"
      - "docs/backend/sqlite/schema.sql"
      - "docs/spec/**"
      - "docs/implementation-notes/**"
      - "docs/database-structure.md"
  push:
    branches:
      - main
      - vault.moukaeritai.work
    paths:
      - ".github/workflows/test-write-matrix.yml"
      - "go/**"
      - "rust/**"
      - "python/**"
      - "nodejs/**"
      - "integration-tests/write-matrix/**"
      - "docs/backend/sqlite/schema.sql"
      - "docs/spec/**"
      - "docs/implementation-notes/**"
      - "docs/database-structure.md"

permissions:
  contents: read

jobs:
  write-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/pyproject.toml'

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'nodejs/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go/go.mod'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION="0.16.0"
          ZIG_DIR="zig-x86_64-linux-${ZIG_VERSION}"
          ZIG_TARBALL="${ZIG_DIR}.tar.xz"
          ZIG_URL_OFFICIAL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}"
          ZIG_URL_MIRROR="https://zenithal.link/ziglang/download/${ZIG_VERSION}/${ZIG_TARBALL}"

          # Official SHA256 for 0.16.0 x86_64-linux from https://ziglang.org/download/index.json
          ZIG_SHA256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

          # Attempt official first, fallback to mirror if it fails
          if ! curl -fsSLO "${ZIG_URL_OFFICIAL}"; then
            echo "Official download failed. Falling back to mirror..."
            curl -fsSLO "${ZIG_URL_MIRROR}"
          fi

          echo "${ZIG_SHA256}  ${ZIG_TARBALL}" | shasum -a 256 --check

          tar -xf "${ZIG_TARBALL}"
          echo "${PWD}/${ZIG_DIR}" >> "${GITHUB_PATH}"
          "${PWD}/${ZIG_DIR}/zig" version

      - name: Run write matrix tests
        run: bash integration-tests/write-matrix/test_writer_matrix.sh
