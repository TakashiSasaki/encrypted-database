name: Deploy GitHub Pages

on:
  push:
    branches:
      - encrypted-database
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'browser-test/package-lock.json'

      - name: Install dependencies and build browser-test
        working-directory: ./browser-test
        run: |
          npm ci
          npm run build

      - name: Prepare static files
        run: |
          mkdir -p _site
          # Copy SPA index.html and documentation files
          cp index.html _site/
          cp -r docs _site/
          cp README.md _site/
          cp AGENTS.md _site/
          cp -r python _site/python || true
          cp -r nodejs _site/nodejs || true

          # Create demo directory and copy browser-test build artifacts
          mkdir -p _site/demo
          cp -r browser-test/dist/* _site/demo/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
