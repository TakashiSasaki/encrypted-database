name: Browser Tests

on:
  push:
    branches:
      - encrypted-database
      - main
  pull_request:
    branches:
      - encrypted-database
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'browser-test/package-lock.json'

      - name: Install dependencies and run tests
        working-directory: ./browser-test
        run: |
          npm ci
          npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: browser
          directory: ./browser-test
