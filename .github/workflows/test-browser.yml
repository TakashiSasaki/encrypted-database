name: Browser Tests

on:
  push:
    branches:
      - vault.moukaeritai.work
  pull_request:
    branches:
      - vault.moukaeritai.work
  workflow_dispatch:

permissions:

  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'browser-test/package-lock.json'

      - name: Install dependencies and run tests with coverage
        working-directory: ./browser-test
        run: |
          npm ci
          npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-coverage
          path: browser-test/coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./browser-test/coverage/lcov.info
          flags: browser-test
          name: browser-test-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
