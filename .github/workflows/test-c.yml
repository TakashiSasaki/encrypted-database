name: C Tests

on:
  push:
    branches: [ vault.moukaeritai.work ]
    paths:
      - "c/**"
      - ".github/workflows/test-c.yml"
      - "README.md"
      - "AGENTS.md"
      - "docs/spec/**"
      - "docs/implementation-notes/**"
      - "test-vectors/aad/**"
      - "test-vectors/jcs/**"
      - "scripts/generate_aad_test_vectors.py"
      - "scripts/generate_jcs_test_vectors.py"
  pull_request:
    branches: [ vault.moukaeritai.work ]
    paths:
      - "c/**"
      - ".github/workflows/test-c.yml"
      - "README.md"
      - "AGENTS.md"
      - "docs/spec/**"
      - "docs/implementation-notes/**"
      - "test-vectors/aad/**"
      - "test-vectors/jcs/**"
      - "scripts/generate_aad_test_vectors.py"
      - "scripts/generate_jcs_test_vectors.py"

jobs:
  test-c:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run C Tests
        run: |
          cd c
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
