name: C++ Tests

on:
  push:
    branches: [ vault.moukaeritai.work ]
    paths:
      - "cpp/**"
      - ".github/workflows/test-cpp.yml"
      - "docs/spec/**"
  pull_request:
    branches: [ vault.moukaeritai.work ]
    paths:
      - "cpp/**"
      - ".github/workflows/test-cpp.yml"
      - "docs/spec/**"

jobs:
  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Run C++ Tests
        run: |
          cd cpp
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
