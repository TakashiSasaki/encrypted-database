[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "encrypted_storage"
version = "0.1.0"
description = "A Python library for an encrypted database with unified key management."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "vault.moukaeritai.work Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=41.0.0",
    "jcs>=0.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/TakashiSasaki/vault.moukaeritai.work"
Repository = "https://github.com/TakashiSasaki/vault.moukaeritai.work"
